<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админ-панель</title>
    <link rel="stylesheet" href="{{ url_for('theme_css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-page);
            font-family: 'Roboto', Arial, sans-serif;
            padding: 20px;
        }

        .login-container {
            background: var(--bg-surface);
            border: 1px solid var(--accent-faint);
            border-top: 2px solid var(--accent);
            padding: 2.5rem;
            border-radius: 2px;
            box-shadow: 0 0 60px rgba(var(--accent-rgb), 0.15);
            width: 100%;
            max-width: 380px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: var(--bg-inset);
            border: 1px solid var(--border);
            border-radius: 2px;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .form-group input::placeholder {
            color: var(--text-dim);
        }

        .error .form-group input {
            border-color: var(--accent);
            animation: shake 0.3s ease-in-out;
        }

        .submit-btn {
            background: var(--accent);
            color: var(--on-accent);
            border: none;
            padding: 0.9rem;
            border-radius: 2px;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.3);
        }

        .submit-btn:disabled {
            background: var(--accent-dim);
            color: var(--text-dim);
            cursor: not-allowed;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Админ-панель</h1>
        </div>
        <form method="post" class="login-form" id="loginForm">
            <div class="form-group">
                <input type="password" name="password" placeholder="Пароль" required autocomplete="current-password">
            </div>
            <button type="submit" class="submit-btn">Войти</button>
        </form>
    </div>
    <script>
        if (window.location.search.includes('error')) {
            document.querySelector('.login-container').classList.add('error');
            setTimeout(() => {
                document.querySelector('.login-container').classList.remove('error');
            }, 1000);
        }

        document.getElementById('loginForm').addEventListener('submit', function() {
            const submitBtn = this.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Вход...';
        });
    </script>
</body>
</html>
